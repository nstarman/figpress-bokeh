name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Version matches its tag form
        run: python3 scripts/version.py check
      - name: Python tests (Chrome comes with the runner image)
        run: uv run pytest -v
      - name: Runtime tests
        run: if ls tests/*.test.mjs >/dev/null 2>&1; then node --test "tests/*.test.mjs"; fi
      - name: The Python package builds and imports
        run: |
          uv build
          uv run --no-project --with dist/*.whl python -c "import figpress_bokeh as f; print(f.__version__)"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Playwright's Chromium
        run: uv run playwright install --with-deps chromium
      - name: The web figure in a browser
        run: uv run pytest -m smoke -v
